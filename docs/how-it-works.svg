<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1.4">
      <stop offset="0" stop-color="#1E6B54"/>
      <stop offset="0.45" stop-color="#0F3D31"/>
      <stop offset="1" stop-color="#0A231C"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7FD9B0"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- phone -->
  <g transform="translate(70 70)">
    <rect width="260" height="160" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <g transform="translate(30 30)" fill="none" stroke="#7FD9B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="26" height="42" rx="5"/>
      <path d="M10 36h6"/>
    </g>
    <text x="30" y="108" fill="#FFFFFF" font-size="22" font-weight="600">Your phone</text>
    <text x="30" y="136" fill="#B9D3C9" font-size="16">a regular or Telegram call</text>
  </g>

  <!-- linux box -->
  <g transform="translate(470 70)">
    <rect width="260" height="160" rx="18" fill="#FFFFFF" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.55"/>
    <g transform="translate(30 30)" fill="none" stroke="#7FD9B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 30h7a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V24a19 19 0 0 1 38 0v16a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4h7"/>
    </g>
    <text x="30" y="108" fill="#FFFFFF" font-size="22" font-weight="600">Linux box</text>
    <text x="30" y="136" fill="#B9D3C9" font-size="16">pretends to be a headset</text>
  </g>

  <!-- gemini -->
  <g transform="translate(870 70)">
    <rect width="260" height="160" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <g transform="translate(30 30)" fill="none" stroke="#7FD9B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2c1.6 9.4 9.6 17.4 19 19-9.4 1.6-17.4 9.6-19 19-1.6-9.4-9.6-17.4-19-19 9.4-1.6 17.4-9.6 19-19z"/>
    </g>
    <text x="30" y="108" fill="#FFFFFF" font-size="22" font-weight="600">Gemini Live</text>
    <text x="30" y="136" fill="#B9D3C9" font-size="16">listens and does the talking</text>
  </g>

  <!-- links -->
  <g stroke="#7FD9B0" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M342 150h116"/>
    <path d="M742 150h116"/>
  </g>
  <g fill="#B9D3C9" font-size="15" text-anchor="middle">
    <text x="400" y="128">Bluetooth</text>
    <text x="400" y="180">call audio</text>
    <text x="800" y="128">internet</text>
    <text x="800" y="180">voice stream</text>
  </g>
</svg>
